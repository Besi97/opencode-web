name: Publish image

# Image tags mirror the pinned OpenCode version (ARG OPENCODE_VERSION in the Dockerfile).
# Version tags are immutable once published; rebuilds of the same pin get auto-revisions:
#   push to main     -> :latest, :sha-<full>, plus the release tag computed as:
#                         v$VER missing        -> push v$VER,        publish :$VER
#                         v$VER at HEAD        -> no new tag,         republish :$VER (re-run)
#                         vX.Y.Z-rev<N> at HEAD-> no new tag,         republish :$VER-rev<N> (re-run)
#                         otherwise            -> push v$VER-rev<N+1>, publish :$VER-rev<N+1>
#                       (tags pushed by this workflow do not re-trigger it, hence the
#                        main build publishes the image tag itself)
#   tag vX.Y.Z(-revN) -> :X.Y.Z(-revN), :vX.Y.Z(-revN) (manual release/rebuild tags)

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Resolve release tag
        if: github.ref == 'refs/heads/main'
        id: tag
        run: |
          set -eu
          IMAGE="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          VER=$(grep -m1 '^ARG OPENCODE_VERSION=' Dockerfile | cut -d= -f2 | tr -d '[:space:]')
          HEAD_SHA=$(git rev-parse HEAD)
          TAGGED_SHA=$(git ls-remote origin "refs/tags/v$VER^{}" | cut -f1)
          if [ -z "$TAGGED_SHA" ]; then
            TAGGED_SHA=$(git ls-remote origin "refs/tags/v$VER" | cut -f1)
          fi
          if [ -z "$TAGGED_SHA" ]; then
            NEW_TAG="v$VER"; IMAGE_TAG="$VER"
          elif [ "$TAGGED_SHA" = "$HEAD_SHA" ]; then
            NEW_TAG=""; IMAGE_TAG="$VER"
          else
            HEAD_REV=$(git ls-remote origin "refs/tags/v$VER*" | awk -F'\t' -v s="$HEAD_SHA" '$1==s && $2 ~ /\^\{\}$/' | head -1 | cut -f2 | sed "s|refs/tags/v$VER||; s|\^{}||")
            if [ -n "$HEAD_REV" ]; then
              NEW_TAG=""; IMAGE_TAG="$VER$HEAD_REV"
            else
              N=$(git ls-remote origin "refs/tags/v$VER-rev*" | sed -nE "s|.*refs/tags/v$VER-rev([0-9]+)$|\1|p" | sort -n | tail -1)
              NEW_TAG="v$VER-rev$(( ${N:-0} + 1 ))"; IMAGE_TAG="$VER-rev$(( ${N:-0} + 1 ))"
            fi
          fi
          if [ -n "$NEW_TAG" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$NEW_TAG" -m "opencode $VER"
            git push origin "$NEW_TAG"
            echo "pushed $NEW_TAG"
          else
            echo "v$VER already points at HEAD, no new tag"
          fi
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "imagetag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=sha,format=long

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.meta.outputs.tags }}
            ${{ steps.tag.outputs.imagetag && format('{0}:{1}', steps.tag.outputs.image, steps.tag.outputs.imagetag) || '' }}
            ${{ steps.tag.outputs.imagetag && format('{0}:v{1}', steps.tag.outputs.image, steps.tag.outputs.imagetag) || '' }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
